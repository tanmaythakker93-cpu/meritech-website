[build]
  publish = "."
  # functions = "netlify/functions"  # HELD 2026-11-13: pin-feedback backend moved to _held/pins.js; restore to re-enable pins

# [functions]
#   node_bundler = "esbuild"

# Held pages (unapproved, orphaned): files kept on disk, served as 404.
[[redirects]]
  from = "/story_*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/success_stories"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/success_stories.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/news_events"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/news_events.html"
  to = "/404.html"
  status = 404
  force = true

# Pin-feedback backend held off the live site (D-008 follow-up): source kept in _held/, not served.
[[redirects]]
  from = "/_held/*"
  to = "/404.html"
  status = 404
  force = true
